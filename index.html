&lt;style&gt;
:root{
  --bg:#F3F0E8;--text:#25332F;--muted:#66736C;--primary:#3E7C68;--primary-dark:#285947;
  --accent:#D78345;--surface:#FFFDF8;--line:#D8DED6;--soft:#E7F0EA;--good:#4E8A5C;--bad:#B85B4A;
  --shadow:0 14px 34px rgba(50,65,55,.12);--radius:20px
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,Arial,sans-serif;line-height:1.5}
button{font:inherit}
.page{min-height:100vh;padding:28px 34px 42px;max-width:1600px;margin:auto}
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin:0 0 22px;padding:0 8px}
.eyebrow{font-size:13px;letter-spacing:2px;color:var(--primary);font-weight:800;text-transform:uppercase}
h1{font-size:clamp(34px,4vw,62px);line-height:1.03;margin:8px 0 10px;letter-spacing:-1px}
.lede{margin:0;color:var(--muted);font-size:17px;max-width:780px}
.badge{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:9px 14px;font-weight:800;color:var(--primary-dark);white-space:nowrap}
.badge:before{content:&quot;&quot;;width:9px;height:9px;border-radius:50%;background:var(--accent)}
.shell{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(360px,.75fr);gap:22px;align-items:start}
.panel{background:var(--surface);border:1px solid rgba(62,124,104,.16);border-radius:var(--radius);box-shadow:var(--shadow)}
.reader{padding:20px}
.reader-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px}
.reader-head h2,.side h2{font-size:24px;margin:0;color:var(--primary-dark)}
.counter{font-size:14px;color:var(--muted);font-weight:800}
.visual-wrap{background:#e8e2d6;border-radius:17px;padding:12px;min-height:365px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.visual-wrap img{display:block;width:100%;height:auto;max-height:520px;object-fit:contain;border-radius:10px;background:#eee;box-shadow:0 5px 14px rgba(46,55,45,.1)}
.visual-wrap img.is-loading{opacity:.4}
.visual-wrap img.is-error{display:none}
.image-error{display:none;text-align:center;color:var(--bad);padding:56px 18px;font-weight:700}
.image-error.show{display:block}
.caption{padding:18px 6px 0}
.caption-kicker{color:var(--accent);font-size:12px;font-weight:900;letter-spacing:1.5px;text-transform:uppercase}
.sentence-list{display:grid;gap:10px;margin-top:10px}
.sentence-row{width:100%;display:flex;align-items:center;justify-content:space-between;gap:13px;text-align:left;border:1px solid var(--line);background:#fbfaf5;border-radius:14px;padding:13px 15px;cursor:pointer;color:var(--text);transition:.18s ease;min-height:56px}
.sentence-row:hover,.sentence-row:focus-visible{border-color:var(--primary);transform:translateY(-2px);outline:none;background:#f4faf6}
.sentence-row.playing{border-color:var(--accent);background:#fff4e9;box-shadow:0 0 0 3px rgba(215,131,69,.12)}
.english-text{font-size:20px;font-weight:750;letter-spacing:.1px}
.sentence-cn{font-size:13px;color:var(--muted);display:block;margin-top:3px}
.play-dot{flex:0 0 34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--primary);color:white;font-weight:900;font-size:15px}
.nav-row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px}
.nav-btn,.action-btn{border:1px solid var(--primary);border-radius:12px;padding:10px 16px;background:var(--primary);color:white;font-weight:800;cursor:pointer;transition:.18s ease}
.nav-btn.secondary,.action-btn.secondary{background:transparent;color:var(--primary-dark);border-color:var(--line)}
.nav-btn:hover,.action-btn:hover{filter:brightness(.96);transform:translateY(-1px)}
.nav-btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.side{display:grid;gap:18px}
.side-card{padding:20px}
.side-card h2{margin-bottom:14px}
.vocab-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.vocab-card{position:relative;border:1px solid var(--line);background:#fbfaf5;border-radius:14px;padding:13px 12px 12px;text-align:left;cursor:pointer;transition:.18s ease;min-height:90px}
.vocab-card:hover,.vocab-card:focus-visible{border-color:var(--primary);background:#f2f8f3;transform:translateY(-2px);outline:none}
.vocab-card.playing{border-color:var(--accent);background:#fff4e9}
.vocab-card .en{display:block;font-size:18px;font-weight:850;color:var(--primary-dark);padding-right:24px}
.vocab-card .zh{display:block;color:var(--muted);font-size:14px;margin-top:4px}
.vocab-card .mini-play{position:absolute;right:11px;top:13px;color:var(--accent);font-weight:900}
.pattern{border-left:5px solid var(--accent);background:#fff7ed;border-radius:13px;padding:14px 15px;margin-top:12px}
.pattern strong{display:block;color:#8b4d28;font-size:19px;margin-bottom:4px}
.pattern span{color:var(--muted);font-size:14px}
.sentence-bank-title{margin-top:18px;font-size:12px;letter-spacing:1.2px;text-transform:uppercase;font-weight:900;color:var(--primary)}
#sentenceBank .sentence-row{padding:10px 12px;min-height:48px}
#sentenceBank .english-text{font-size:16px}
#sentenceBank .sentence-cn{font-size:12px}
.practice{padding:20px}
.practice h2{margin-bottom:7px}
.practice-tip{font-size:14px;color:var(--muted);margin:0 0 14px}
.question-box{background:#f2f7f2;border:1px solid #d5e5d9;border-radius:15px;padding:16px;margin-bottom:12px}
.question-label{font-size:12px;color:var(--primary);font-weight:900;letter-spacing:1.2px;text-transform:uppercase}
.question{font-size:23px;font-weight:850;margin:8px 0 13px}
.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.option{border:1px solid var(--line);background:white;border-radius:11px;padding:11px 12px;text-align:left;cursor:pointer;color:var(--text);font-weight:750}
.option:hover,.option:focus-visible{border-color:var(--primary);outline:none}
.option.correct{background:#e7f5e9;border-color:var(--good);color:#27653a}
.option.wrong{background:#fff0ed;border-color:var(--bad);color:#8e3e32}
.feedback{min-height:25px;margin-top:12px;font-weight:800;color:var(--muted)}
.feedback.good{color:var(--good)}.feedback.bad{color:var(--bad)}
.progress{height:8px;background:#e5ebe4;border-radius:999px;overflow:hidden;margin:12px 0 16px}.progress span{display:block;height:100%;background:var(--primary);width:0;transition:.25s ease}
.small-note{font-size:13px;color:var(--muted);margin:0}
.thin-rule{height:1px;background:var(--line);margin:18px 0}
.source-note{font-size:12px;color:#7d8880;margin:0}
@media(max-width:1050px){.shell{grid-template-columns:1fr}.side{grid-template-columns:1fr 1fr}.practice{grid-column:1/-1}}
@media(max-width:680px){.page{padding:18px 13px 30px}.topbar{display:block}.badge{margin-top:16px}.reader,.side-card,.practice{padding:15px}.side{grid-template-columns:1fr}.visual-wrap{min-height:250px;padding:8px}.english-text{font-size:17px}.vocab-grid,.options{grid-template-columns:1fr 1fr}.question{font-size:20px}}
&lt;/style&gt;

  currentAudioToken++;
  if(currentAudio){currentAudio.pause();currentAudio.currentTime=0;currentAudio=null;}
  document.querySelectorAll('.playing').forEach(el=&gt;el.classList.remove('playing'));
}
function playAudio(url,element){
  stopAudio();
  const token=currentAudioToken;
  if(element) element.classList.add('playing');
  const audio=new Audio(url);
  currentAudio=audio;
  audio.addEventListener('ended',()=&gt;{if(token===currentAudioToken){element&amp;&amp;element.classList.remove('playing');currentAudio=null;}});
  audio.addEventListener('error',()=&gt;{if(token===currentAudioToken){element&amp;&amp;element.classList.remove('playing');currentAudio=null;}});
  audio.play().catch(()=&gt;{if(token===currentAudioToken){element&amp;&amp;element.classList.remove('playing');currentAudio=null;}});
}
